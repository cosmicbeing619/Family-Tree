<style>
:root{--ink:#17312a;--muted:#66776f;--paper:#f7f7f2;--panel:#fffefb;--line:#46675c;--sage:#dfe9df;--gold:#d7a84e;--woman:#bd625a;--man:#42739a;--nb:#b98435;--u:#68756e;--shadow:0 16px 48px rgba(17,45,37,.16)}

button,input{font:inherit}.topbar{position:fixed;z-index:10;left:16px;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #c4d1c9;border-radius:18px;background:rgba(255,254,251,.94);box-shadow:0 9px 30px rgba(16,55,43,.12);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}.brandmark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#163d32;color:#f3ca72}.brandmark svg{width:25px;height:25px}.brand strong{display:block;font:700 17px/1.1 Georgia,serif}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.search{position:relative;flex:1;max-width:440px}.search svg{position:absolute;left:12px;top:50%;width:18px;transform:translateY(-50%);color:#718179}.search input{width:100%;height:42px;padding:0 38px;border:1px solid #c7d3cb;border-radius:12px;background:#f8faf7;color:var(--ink);outline:none}.search input:focus{border-color:#5f8a7c;box-shadow:0 0 0 3px rgba(95,138,124,.17)}.search-results{display:none;position:absolute;left:0;right:0;top:48px;max-height:280px;overflow:auto;padding:6px;border:1px solid #c7d3cb;border-radius:12px;background:#fff;box-shadow:var(--shadow)}.search-results.show{display:block}.result{width:100%;display:flex;align-items:center;gap:9px;padding:9px;border:0;border-radius:9px;background:none;text-align:left;color:var(--ink);cursor:pointer}.result:hover,.result:focus{background:#edf3ed;outline:none}.dot{width:10px;height:10px;flex:none;border-radius:50%}
.controls{margin-left:auto;display:flex;gap:6px}.iconbtn{height:42px;min-width:42px;padding:0 12px;display:grid;place-items:center;border:1px solid transparent;border-radius:11px;background:transparent;color:#174b3d;cursor:pointer}.iconbtn:hover,.iconbtn:focus-visible{background:#e8efe9;border-color:#c9d5cd;outline:none}.zoomread{min-width:48px;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700}

 const parentsByChild=new Map;for(const l of links)parentsByChild.set(l.child_id,[...(parentsByChild.get(l.child_id)||[]),l.parent_id]);
 const depth=new Map(people.map(p=>[p.id,0]));
 for(let pass=0;pass<people.length*2;pass++){let changed=false;for(const r of relationships){if(r.kind!=='partner')continue;const d=Math.max(depth.get(r.person_a_id)||0,depth.get(r.person_b_id)||0);if((depth.get(r.person_a_id)||0)!==d||(depth.get(r.person_b_id)||0)!==d)changed=true;depth.set(r.person_a_id,d);depth.set(r.person_b_id,d)}for(const l of links){const d=(depth.get(l.parent_id)||0)+1;if((depth.get(l.child_id)||0)<d){depth.set(l.child_id,d);changed=true}}if(!changed)break}
 const partnerIds=new Map;for(const r of relationships){if(r.kind!=='partner')continue;partnerIds.set(r.person_a_id,[...(partnerIds.get(r.person_a_id)||[]),r.person_b_id]);partnerIds.set(r.person_b_id,[...(partnerIds.get(r.person_b_id)||[]),r.person_a_id])}
 const blocks=[],seen=new Set;for(const p of people){if(seen.has(p.id))continue;const ids=[],q=[p.id];while(q.length){const id=q.shift();if(id==null||seen.has(id))continue;seen.add(id);ids.push(id);q.push(...(partnerIds.get(id)||[]).filter(x=>!seen.has(x)))}const members=ids.map(id=>byId.get(id)).filter(Boolean).sort((a,b)=>a.id-b.id);const d=Math.max(...members.map(m=>depth.get(m.id)||0));blocks.push({id:Math.min(...ids),depth:d,members,width:members.length*W+Math.max(0,members.length-1)*PARTNER_GAP,center:0})}
 const blockByPerson=new Map,offset=new Map;for(const b of blocks)b.members.forEach((m,i)=>{blockByPerson.set(m.id,b);offset.set(m.id,-b.width/2+W/2+i*(W+PARTNER_GAP))});
 const parentBlocks=new Map,childBlocks=new Map;for(const l of links){const pb=blockByPerson.get(l.parent_id),cb=blockByPerson.get(l.child_id);if(!pb||!cb||pb.id===cb.id)continue;if(!parentBlocks.has(cb.id))parentBlocks.set(cb.id,new Set);parentBlocks.get(cb.id).add(pb.id);if(!childBlocks.has(pb.id))childBlocks.set(pb.id,new Set);childBlocks.get(pb.id).add(cb.id)}
 const maxDepth=Math.max(...blocks.map(b=>b.depth)),levels=new Map;for(const b of blocks)levels.set(b.depth,[...(levels.get(b.depth)||[]),b]);for(const row of levels.values())row.sort((a,b)=>a.id-b.id);
 for(let pass=0;pass<5;pass++){for(let d=1;d<=maxDepth;d++){const prev=levels.get(d-1)||[],pos=new Map(prev.map((b,i)=>[b.id,i]));(levels.get(d)||[]).sort((a,b)=>score(a,parentBlocks,pos)-score(b,parentBlocks,pos)||a.id-b.id)}for(let d=maxDepth-1;d>=0;d--){const next=levels.get(d+1)||[],pos=new Map(next.map((b,i)=>[b.id,i]));(levels.get(d)||[]).sort((a,b)=>score(a,childBlocks,pos)-score(b,childBlocks,pos)||a.id-b.id)}}
 function score(block,map,pos){const ps=[...(map.get(block.id)||[])].map(id=>pos.get(id)).filter(x=>x!=null);return ps.length?ps.reduce((s,x)=>s+x,0)/ps.length:Number.MAX_SAFE_INTEGER}
 for(let d=0;d<=maxDepth;d++){const row=levels.get(d)||[];let cursor=0;for(const b of row){b.center=cursor+b.width/2;cursor+=b.width+FAMILY_GAP}const rw=Math.max(0,cursor-FAMILY_GAP);for(const b of row)b.center-=rw/2}
 function placeLevel(row,desired){if(!row.length)return;const centers=row.map(b=>desired.has(b.id)?desired.get(b.id):b.center);for(let i=1;i<row.length;i++){const prev=row[i-1],cur=row[i],min=centers[i-1]+prev.width/2+FAMILY_GAP+cur.width/2;centers[i]=Math.max(centers[i],min)}const anchored=row.filter(b=>desired.has(b.id));if(anchored.length){const shift=anchored.reduce((s,b)=>{const i=row.indexOf(b);return s+desired.get(b.id)-centers[i]},0)/anchored.length;for(let i=0;i<centers.length;i++)centers[i]+=shift}row.forEach((b,i)=>b.center=centers[i])}
 for(let pass=0;pass<4;pass++){for(let d=1;d<=maxDepth;d++){const desired=new Map;for(const b of levels.get(d)||[]){const targets=[];for(const m of b.members){const cs=(parentsByChild.get(m.id)||[]).map(id=>{const pb=blockByPerson.get(id);return pb?pb.center+(offset.get(id)||0):null}).filter(x=>x!=null);if(cs.length)targets.push(cs.reduce((s,x)=>s+x,0)/cs.length-(offset.get(m.id)||0))}if(targets.length)desired.set(b.id,targets.reduce((s,x)=>s+x,0)/targets.length)}placeLevel(levels.get(d)||[],desired)}for(let d=maxDepth-1;d>=0;d--){const desired=new Map;for(const b of levels.get(d)||[]){const targets=[];for(const m of b.members)for(const l of links)if(l.parent_id===m.id){const cb=blockByPerson.get(l.child_id);if(cb)targets.push(cb.center+(offset.get(l.child_id)||0)-(offset.get(m.id)||0))}if(targets.length)desired.set(b.id,targets.reduce((s,x)=>s+x,0)/targets.length)}placeLevel(levels.get(d)||[],desired)}}
 let left=Infinity,right=-Infinity;for(const b of blocks){left=Math.min(left,b.center-b.width/2);right=Math.max(right,b.center+b.width/2)}const shift=PAD-left,nodes=[];for(const b of blocks)for(const m of b.members){const cx=b.center+(offset.get(m.id)||0)+shift;nodes.push({...m,x:cx-W/2,y:PAD+b.depth*(H+Y_GAP)})}return{nodes,width:Math.max(760,right-left+PAD*2),height:Math.max(420,PAD*2+(maxDepth+1)*H+maxDepth*Y_GAP)}
}
function familyBranches(){const partnerPairs=new Set(relationships.filter(r=>r.kind==='partner').map(r=>pairKey(r.person_a_id,r.person_b_id))),byChild=new Map;for(const l of links)byChild.set(l.child_id,[...(byChild.get(l.child_id)||[]),l]);const shared=new Map;for(const [child,ls] of byChild){if(ls.length===2&&partnerPairs.has(pairKey(ls[0].parent_id,ls[1].parent_id)))shared.set(child,[ls[0].parent_id,ls[1].parent_id].sort((a,b)=>a-b))}const groups=new Map;for(const l of links){const pids=shared.get(l.child_id)||[l.parent_id],key=pids.join(':');if(!groups.has(key))groups.set(key,{key,parentIds:pids,childIds:[]});const g=groups.get(key);if(!g.childIds.includes(l.child_id))g.childIds.push(l.child_id)}return[...groups.values()]}
function laneFor(a,b){return .1+(Math.abs(a*17+b*31)%11)*.08}
const layout=computeLayout(),nodesById=new Map(layout.nodes.map(n=>[n.id,n]));
function render(){const parts=[];parts.push(`<svg width="${layout.width}" height="${layout.height}" viewBox="0 0 ${layout.width} ${layout.height}" role="img" aria-label="Family tree with ${people.length} people"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#193d33" flood-opacity=".13"/></filter><filter id="hoverShadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193d33" flood-opacity=".22"/></filter></defs>`);
 for(const r of relationships.filter(x=>x.kind==='partner')){const a=nodesById.get(r.person_a_id),b=nodesById.get(r.person_b_id);if(!a||!b)continue;parts.push(`<path class="connector partner" d="M ${a.x+W} ${a.y+H/2} H ${b.x}"/>`)}
 for(const g of familyBranches()){const ps=g.parentIds.map(id=>nodesById.get(id)).filter(Boolean),cs=g.childIds.map(id=>nodesById.get(id)).filter(Boolean);if(!ps.length||!cs.length)continue;const sx=ps.reduce((s,p)=>s+p.x+W/2,0)/ps.length,sy=ps.length>1?ps.reduce((s,p)=>s+p.y+H/2,0)/ps.length:ps[0].y+H,childTop=Math.min(...cs.map(c=>c.y)),branchY=sy+(childTop-sy)*laneFor(g.parentIds[0]||0,g.childIds[0]||0),xs=cs.map(c=>c.x+W/2),min=Math.min(...xs),max=Math.max(...xs);parts.push(`<g><path class="connector branch" d="M ${sx} ${sy} V ${branchY}"/><path class="connector branch" d="M ${min} ${branchY} H ${max}"/>`);for(const c of cs)parts.push(`<path class="connector branch" d="M ${c.x+W/2} ${branchY} V ${c.y}"/>`);parts.push('</g>')}
 for(const n of layout.nodes){const ls=wrapName(n.name),ty=ls.length===1?36:28;parts.push(`<g class="person" tabindex="0" role="button" aria-label="Open ${esc(n.name)}" data-id="${n.id}" transform="translate(${n.x} ${n.y})" filter="url(#shadow)"><rect class="card" width="${W}" height="${H}" rx="15"/><rect x="0" y="0" width="7" height="${H}" rx="4" fill="${colors[n.gender]}"/><circle cx="24" cy="21" r="6" fill="${colors[n.gender]}"/>`);ls.forEach((line,i)=>parts.push(`<text class="name" x="42" y="${ty+i*18}">${esc(line)}</text>`));parts.push(`<text class="meta" x="20" y="66">${esc(labels[n.gender])}</text><title>${esc(n.name)} — ${esc(labels[n.gender])}</title></g>`)}parts.push('</svg>');document.getElementById('stage').innerHTML=parts.join('')}
render();
const viewport=document.getElementById('viewport'),stage=document.getElementById('stage'),zoomRead=document.getElementById('zoomRead');let zoom=1,pan={x:0,y:0},drag=null,pointers=new Map,pinch=null;
function apply(){stage.style.transform=`translate(-50%,-50%) translate(${pan.x}px,${pan.y}px) scale(${zoom})`;zoomRead.textContent=Math.round(zoom*100)+'%'}
function fit(){const topGap=105,bottomGap=40,availW=innerWidth-40,availH=innerHeight-topGap-bottomGap;zoom=Math.max(.08,Math.min(availW/layout.width,availH/layout.height,1));pan={x:0,y:(topGap-bottomGap)/2};apply()}
function zoomAt(next,cx=innerWidth/2,cy=innerHeight/2){next=Math.max(.08,Math.min(3,next));const center={x:innerWidth/2+pan.x,y:innerHeight/2+pan.y},wx=(cx-center.x)/zoom,wy=(cy-center.y)/zoom;pan.x+=cx-center.x-wx*next;pan.y+=cy-center.y-wy*next;zoom=next;apply()}
viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(zoom*(e.deltaY<0?1.12:.89),e.clientX,e.clientY)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.person'))return;viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};viewport.classList.add('dragging')}else if(pointers.size===2){const a=[...pointers.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:zoom};drag=null}});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;zoomAt(pinch.z*d/pinch.d,cx,cy)}else if(drag){pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;apply()}});
function pointerUp(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size){drag=null;viewport.classList.remove('dragging')}}viewport.addEventListener('pointerup',pointerUp);viewport.addEventListener('pointercancel',pointerUp);
document.querySelector('[data-action="zoom-in"]').onclick=()=>zoomAt(zoom*1.2);document.querySelector('[data-action="zoom-out"]').onclick=()=>zoomAt(zoom/1.2);document.querySelector('[data-action="fit"]').onclick=fit;addEventListener('resize',fit);
function related(id,kind){return relationships.filter(r=>r.kind===kind&&(r.person_a_id===id||r.person_b_id===id)).map(r=>byId.get(r.person_a_id===id?r.person_b_id:r.person_a_id)).filter(Boolean)}
function unique(arr){return[...new Map(arr.map(x=>[x.id,x])).values()]}
function openPerson(id){const p=byId.get(Number(id));if(!p)return;const parents=unique(links.filter(l=>l.child_id===p.id).map(l=>byId.get(l.parent_id)).filter(Boolean)),children=unique(links.filter(l=>l.parent_id===p.id).map(l=>byId.get(l.child_id)).filter(Boolean)),partners=related(p.id,'partner'),explicitSibs=related(p.id,'sibling'),parentIds=new Set(parents.map(x=>x.id)),shared=people.filter(x=>x.id!==p.id&&links.filter(l=>l.child_id===x.id).some(l=>parentIds.has(l.parent_id))),siblings=unique([...explicitSibs,...shared]);
 document.getElementById('panelName').textContent=p.name;document.getElementById('panelGender').textContent=labels[p.gender];document.getElementById('panelDot').style.background=colors[p.gender];document.getElementById('panelBody').innerHTML=[section('Parents',parents),section('Partners',partners),section('Children',children),section('Siblings',siblings)].join('');document.getElementById('panel').classList.add('open');document.querySelectorAll('.chip.clickable').forEach(el=>el.onclick=()=>{openPerson(el.dataset.id);focusPerson(el.dataset.id)})}
function section(title,items){return `<section class="section"><h3>${title}</h3>${items.length?`<div class="chips">${items.map(x=>`<button class="chip clickable" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>`:'<p class="none">None connected</p>'}</section>`}
function focusPerson(id){const n=nodesById.get(Number(id));if(!n)return;const target=Math.max(zoom,.72),cx=n.x+W/2,cy=n.y+H/2;zoom=target;pan={x:(layout.width/2-cx)*zoom,y:(layout.height/2-cy)*zoom+36};apply();const el=document.querySelector(`.person[data-id="${id}"] rect.card`);if(el){const old=el.style.stroke;el.style.stroke='#d7a84e';el.style.strokeWidth='5';setTimeout(()=>{el.style.stroke=old;el.style.strokeWidth=''},900)}}
stage.addEventListener('click',e=>{const el=e.target.closest('.person');if(el)openPerson(el.dataset.id)});stage.addEventListener('keydown',e=>{const el=e.target.closest('.person');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPerson(el.dataset.id)}});
document.getElementById('closePanel').onclick=()=>document.getElementById('panel').classList.remove('open');
const search=document.getElementById('search'),results=document.getElementById('results');function updateSearch(){const q=search.value.trim().toLocaleLowerCase();if(!q){results.classList.remove('show');results.innerHTML='';return}const found=people.filter(p=>p.name.toLocaleLowerCase().includes(q)).slice(0,12);results.innerHTML=found.length?found.map(p=>`<button class="result" data-id="${p.id}"><span class="dot" style="background:${colors[p.gender]}"></span><span><strong>${esc(p.name)}</strong><br><small>${labels[p.gender]}</small></span></button>`).join(''):'<div class="result">No matching person</div>';results.classList.add('show');results.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{results.classList.remove('show');search.value='';focusPerson(el.dataset.id);openPerson(el.dataset.id)})}search.addEventListener('input',updateSearch);search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';updateSearch();search.blur()}else if(e.key==='Enter'){const first=results.querySelector('[data-id]');if(first)first.click()}});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))results.classList.remove('show')});
document.getElementById('count').textContent=`${people.length} people · interactive view`;fit();
})();
